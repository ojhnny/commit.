# Render Blueprint for the API (free web service). Database: use a free Neon Postgres
# and paste its connection string into DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: commit-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOW_SIGNUP
        value: "true"
